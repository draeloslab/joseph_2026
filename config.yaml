# Whether each figure draws significance brackets/asterisks on its boxplots. The tests (two-sided Mann-Whitney U for
# independent groups, Wilcoxon signed-rank for paired comparisons, Holm-corrected within each panel) always run and are
# written to figures/<fig>_stats.csv; this only controls the bars on the plot.
stats_bars: {2: false, 3: true, 4: true, 5: true, 6: false, S1: false, S2: true, S3: true, S4: true, S5: false}

# Publication style, shared by every figure (see scripts/utils.py:apply_style).
style:
  # print sizes (pt) on the journal page: every figure is shrunk to figure_width_mm (double column = 180 mm) and drawn
  # so that text and lines come out at these sizes (utils.print_rc)
  figure_width_mm: 180
  font_family: [Arial, DejaVu Sans]
  font_size: 7
  title_size: 7.5
  label_size: 7.5
  tick_size: 6.5
  legend_size: 6.5
  panel_label_size: 10
  line_width: 1.25
  axes_line_width: 1.0
  marker_size: 9         # pt^2 (box dots use 0.9x / 1.6x this diameter)
  dpi: 300
  palette:
    bend: '#111111'
    index_angle: '#2a78d6'
    pip_y: '#1baf7a'
    mrs_x: '#eb6834'
    freebie: '#2a78d6'
    target_hit: '#d9d9d9'
    target_miss: '#f6c5c5'
    budget: '#111111'      # frame-budget lines (black in every figure)
    frame_acq: '#0a11c4'
    inference: '#519bc6'
    sender: '#2ccded'
    e2e: '#757272'
    keypoints: ['#FF4444', '#FF9900', '#33CC33', '#3399FF', '#B455E0']   # DIP PIP MCP WRIST MRS
    fingers: {thumb: '#e0475f', index: '#f2a93b', middle: '#6db38a', ring: '#1f8ea3', pinky: '#a77bca', palm: '#9e9e9e'}   # fig 6 skeleton
    fes_x: '#f5a300'       # fig 6 fingertip x (amber), y below (red-orange)
    fes_y: '#e5734f'
    stim_window: '#dedede'

# Settings of the from-scratch analysis (scripts/analysis/, run with --from-raw). The figures themselves do not read this block.
analysis:
  keypoint_likelihood_min: 0.99        # fig 2: predictions below this likelihood are not scored
  latency_skip_first_frames: 1         # fig S2: warm-up frames dropped before pooling
  examples:                            # the traces drawn (run or session, number of consecutive trials)
    fig4: {run: 2026-10-02_Run-005, n_trials: 6}
    fig5_freebie: {run: 2026-10-06_Run-007, n_trials: 6, select: shortest_success}
    fig5_bend: {run: 2026-10-06_Run-006, n_trials: 6, select: shortest_success}
    figS3: {session: 20260213-1028, n_trials: 8}
    figS4_freebie: {run: 20260223_Run-007, n_trials: 8}
    figS4_bend: {run: 20251216_Run-003, n_trials: 8}
  human_runs: {Run-007: 2, Run-008: 3, Run-009: 4}      # fig S1: run -> DOF count
  fes: {video_frames: 2550}            # fig 6: length of each camera's video, in frames
